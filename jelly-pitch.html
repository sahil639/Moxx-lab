<!doctype html>
<html lang="en">

<title>Moxx Lab — Jelly Pitch</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#050806;color:#f3f5f2;overflow:hidden;
    font:300 11.5px/1.5 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.02em}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}

<script type="module">
/* Jelly Pitch — a soft-body jelly ball you can pull apart and cut, on reactive turf.
   Sections: 1 settings · 2 mesh building · 3 XPBD solver · 4 cutting · 5 surface + bubbles · 6 turf field
             7 interaction · 8 WebGPU (shaders, pipelines, frame) · 9 interface, face upload */
const $ = id => document.getElementById(id);
const TAU = Math.PI*2, clamp = (v,a,b) => v<a?a:v>b?b:v;
function mulberry32(a){ return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ==================================================================== 1. SETTINGS
   Real sizes in metres; density is gummy, 1.3 g/cm3. sig = absorption per ball radius, sca = scatter colour. */
const RHO = 1300, GRAV = -9.81, STEP = 1/60, SUBS = 10;
const BALLS = {
  tennis:     { id:0, R:.0335, firm:.40, damp:.45, rind:1, lively:1.0, blade:.011, sig:[1.25,.16,3.4], milk:1.05, sca:[.74,.98,.08], sheen:.9 },
  football:   { id:1, R:.110,  firm:.40, damp:.45, rind:3, lively:1.0, blade:.024, sig:[.22,.18,.16],  milk:1.7, sca:[.96,.96,.93], sheen:0 },
  basketball: { id:2, R:.120,  firm:.56, damp:.30, rind:1, lively:1.7, blade:.024, sig:[.30,1.55,3.6], milk:1.1, sca:[.98,.38,.05], sheen:0 },
};
const S = { tool:'hand', ball:'tennis', firm:.4, damp:.45, slow:false, mesh:false, paused:false, faceOn:false, faceSize:1, faceRot:0, faceInt:.8 };
let cfg = BALLS.tennis, R = cfg.R;

/* ==================================================================== 2. MESH BUILDING */
function icosphere(level){
  const t=(1+Math.sqrt(5))/2;
  let v=[-1,t,0, 1,t,0, -1,-t,0, 1,-t,0, 0,-1,t, 0,1,t, 0,-1,-t, 0,1,-t, t,0,-1, t,0,1, -t,0,-1, -t,0,1];
  let f=[0,11,5, 0,5,1, 0,1,7, 0,7,10, 0,10,11, 1,5,9, 5,11,4, 11,10,2, 10,7,6, 7,1,8, 3,9,4, 3,4,2, 3,2,6, 3,6,8, 3,8,9, 4,9,5, 2,4,11, 6,2,10, 8,6,7, 9,8,1];
  const norm=()=>{ for (let i=0;i<v.length;i+=3){ const l=Math.hypot(v[i],v[i+1],v[i+2]); v[i]/=l; v[i+1]/=l; v[i+2]/=l; } }; norm();
  for (let l=0;l<level;l++){ const cache=new Map(), nf=[];
    const mid=(a,b)=>{ const k=a<b?a*65536+b:b*65536+a; let m=cache.get(k); if (m===undefined){ m=v.length/3; v.push((v[a*3]+v[b*3])/2,(v[a*3+1]+v[b*3+1])/2,(v[a*3+2]+v[b*3+2])/2); cache.set(k,m); } return m; };
    for (let i=0;i<f.length;i+=3){ const a=f[i],b=f[i+1],c=f[i+2], ab=mid(a,b), bc=mid(b,c), ca=mid(c,a); nf.push(a,ab,ca, b,bc,ab, c,ca,bc, ab,bc,ca); }
    f=nf; norm(); }
  return {v,f};
}
const vol6 = (x,a,b,c,d) => { const ax=x[a*3],ay=x[a*3+1],az=x[a*3+2], e1x=x[b*3]-ax,e1y=x[b*3+1]-ay,e1z=x[b*3+2]-az, e2x=x[c*3]-ax,e2y=x[c*3+1]-ay,e2z=x[c*3+2]-az, e3x=x[d*3]-ax,e3y=x[d*3+1]-ay,e3z=x[d*3+2]-az;
  return e1x*(e2y*e3z-e2z*e3y)+e1y*(e2z*e3x-e2x*e3z)+e1z*(e2x*e3y-e2y*e3x); };
// split a triangular prism into three tets so that neighbouring prisms agree on every shared diagonal (smallest index rule)
const PRISM_ROT=[[0,1,2,3,4,5],[1,2,0,4,5,3],[2,0,1,5,3,4],[3,5,4,0,2,1],[4,3,5,1,0,2],[5,4,3,2,1,0]];
function prismTets(p,out){ let m=0; for (let i=1;i<6;i++) if (p[i]<p[m]) m=i; const r=PRISM_ROT[m], V=r.map(i=>p[i]);
  if (Math.min(V[1],V[5])<Math.min(V[2],V[4])) out.push(V[0],V[1],V[2],V[5], V[0],V[1],V[5],V[4], V[0],V[4],V[5],V[3]);
  else out.push(V[0],V[1],V[2],V[4], V[0],V[4],V[2],V[5], V[0],V[4],V[5],V[3]); }

// particle + tet state (typed arrays, rebuilt whenever the topology changes)
let np=0, nt=0, X, PX, V, XR, W, PIECE, CUT, TV, DMI, VOL, Q, STIFF, TPIECE, EDGE, nPieces=1, cutCount=0, restVolume=1;

function buildBall(){
  cfg=BALLS[S.ball]; R=cfg.R; cutCount=0;
  const ico=icosphere(2), nv=ico.v.length/3, shells=[1,.62], xr=[], raw=[], tets=[], stiff=[];   // two layers plus the centre: 1280 tets
  for (const s of shells) for (let i=0;i<nv*3;i++) xr.push(ico.v[i]*R*s);
  xr.push(0,0,0); const C=shells.length*nv;
  const add=(a,b,c,d,k)=>{ if (vol6(xr,a,b,c,d)<0){ const t=c; c=d; d=t; } tets.push(a,b,c,d); stiff.push(k); };
  for (let i=0;i<ico.f.length;i+=3){ const a=ico.f[i], b=ico.f[i+1], c=ico.f[i+2];
    for (let s=0;s<shells.length-1;s++){ raw.length=0; prismTets([s*nv+a,s*nv+b,s*nv+c,(s+1)*nv+a,(s+1)*nv+b,(s+1)*nv+c],raw);
      for (let k=0;k<12;k+=4) add(raw[k],raw[k+1],raw[k+2],raw[k+3], s===0?cfg.rind:1); }
    const L=(shells.length-1)*nv; add(L+a,L+b,L+c,C,1); }
  const n=xr.length/3, px=new Array(n*3), drop=R*1.55;
  for (let i=0;i<n;i++){ px[i*3]=xr[i*3]; px[i*3+1]=xr[i*3+1]+drop; px[i*3+2]=xr[i*3+2]; }
  setMesh(px, px.slice(), new Array(n*3).fill(0), xr, new Array(n).fill(0), tets, stiff, null);
  restVolume=0; for (let t=0;t<nt;t++) restVolume+=VOL[t];
  makeBubbles(); grab=null; knife=null;
}
function setMesh(px,ppx,pv,pr,pcut,tets,stiff,quats){
  np=px.length/3; nt=tets.length/4;
  X=new Float32Array(px); PX=new Float32Array(ppx); V=new Float32Array(pv); XR=new Float32Array(pr); CUT=new Uint32Array(pcut);
  TV=new Uint32Array(tets); STIFF=new Float32Array(stiff); Q=new Float32Array(nt*4); DMI=new Float32Array(nt*9); VOL=new Float32Array(nt);
  const mass=new Float32Array(np);
  for (let t=0;t<nt;t++){
    if (quats){ Q[t*4]=quats[t*4]; Q[t*4+1]=quats[t*4+1]; Q[t*4+2]=quats[t*4+2]; Q[t*4+3]=quats[t*4+3]; } else Q[t*4+3]=1;
    const a=TV[t*4]*3,b=TV[t*4+1]*3,c=TV[t*4+2]*3,d=TV[t*4+3]*3;
    const m00=XR[b]-XR[a], m10=XR[b+1]-XR[a+1], m20=XR[b+2]-XR[a+2], m01=XR[c]-XR[a], m11=XR[c+1]-XR[a+1], m21=XR[c+2]-XR[a+2], m02=XR[d]-XR[a], m12=XR[d+1]-XR[a+1], m22=XR[d+2]-XR[a+2];
    const det=m00*(m11*m22-m12*m21)-m01*(m10*m22-m12*m20)+m02*(m10*m21-m11*m20), id=1/det, o=t*9;
    DMI[o]=(m11*m22-m12*m21)*id; DMI[o+1]=(m02*m21-m01*m22)*id; DMI[o+2]=(m01*m12-m02*m11)*id;
    DMI[o+3]=(m12*m20-m10*m22)*id; DMI[o+4]=(m00*m22-m02*m20)*id; DMI[o+5]=(m02*m10-m00*m12)*id;
    DMI[o+6]=(m10*m21-m11*m20)*id; DMI[o+7]=(m01*m20-m00*m21)*id; DMI[o+8]=(m00*m11-m01*m10)*id;
    VOL[t]=det/6; const m=RHO*VOL[t]/4; mass[a/3]+=m; mass[b/3]+=m; mass[c/3]+=m; mass[d/3]+=m; }
  W=new Float32Array(np); for (let i=0;i<np;i++) W[i]=mass[i]>0?1/mass[i]:0;
  // pieces = connected groups of tets
  const par=new Int32Array(np); for (let i=0;i<np;i++) par[i]=i;
  const find=i=>{ while (par[i]!==i){ par[i]=par[par[i]]; i=par[i]; } return i; };
  for (let t=0;t<nt;t++){ const a=find(TV[t*4]); for (let k=1;k<4;k++){ const b=find(TV[t*4+k]); if (b!==a) par[b]=a; } }
  const ids=new Map(); PIECE=new Int32Array(np); TPIECE=new Int32Array(nt);
  for (let i=0;i<np;i++){ const r=find(i); if (!ids.has(r)) ids.set(r,ids.size); PIECE[i]=ids.get(r); }
  for (let t=0;t<nt;t++) TPIECE[t]=PIECE[TV[t*4]]; nPieces=ids.size;
  const es=new Set(), pr6=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
  for (let t=0;t<nt;t++) for (const [i,j] of pr6){ const a=TV[t*4+i], b=TV[t*4+j]; es.add(a<b?a*131072+b:b*131072+a); }
  EDGE=new Uint32Array(es.size*2); let e=0; for (const k of es){ EDGE[e++]=Math.floor(k/131072); EDGE[e++]=k%131072; }
  buildSurface(); pieceInfo();
}

/* ==================================================================== 3. XPBD SOLVER
   Fixed 60 Hz step, 10 substeps. Per tet: a co-rotational constraint |F - R| (R from a warm-started polar
   decomposition) and a volume constraint det F - 1, both with finite compliance. Damping acts on relative
   velocity along mesh edges only. Ground contact has Coulomb-style friction. */
let grab=null, knife=null, contacts=[];
function solveTets(h, mu, bulk){
  const ih2=1/(h*h);
  for (let t=0;t<nt;t++){
    const a=TV[t*4]*3, b=TV[t*4+1]*3, c=TV[t*4+2]*3, d=TV[t*4+3]*3, o=t*9, wa=W[a/3], wb=W[b/3], wc=W[c/3], wd=W[d/3];
    const i00=DMI[o],i01=DMI[o+1],i02=DMI[o+2],i10=DMI[o+3],i11=DMI[o+4],i12=DMI[o+5],i20=DMI[o+6],i21=DMI[o+7],i22=DMI[o+8];
    for (let pass=0;pass<2;pass++){
      const ax=X[a],ay=X[a+1],az=X[a+2], d00=X[b]-ax,d10=X[b+1]-ay,d20=X[b+2]-az, d01=X[c]-ax,d11=X[c+1]-ay,d21=X[c+2]-az, d02=X[d]-ax,d12=X[d+1]-ay,d22=X[d+2]-az;
      const f00=d00*i00+d01*i10+d02*i20, f01=d00*i01+d01*i11+d02*i21, f02=d00*i02+d01*i12+d02*i22;
      const f10=d10*i00+d11*i10+d12*i20, f11=d10*i01+d11*i11+d12*i21, f12=d10*i02+d11*i12+d12*i22;
      const f20=d20*i00+d21*i10+d22*i20, f21=d20*i01+d21*i11+d22*i21, f22=d20*i02+d21*i12+d22*i22;
      let p00,p01,p02,p10,p11,p12,p20,p21,p22,Cv,alpha;
      if (pass===0){
        // one step of rotation extraction, warm-started from the last substep
        let qx=Q[t*4],qy=Q[t*4+1],qz=Q[t*4+2],qw=Q[t*4+3];
        let r00=1-2*(qy*qy+qz*qz), r10=2*(qx*qy+qz*qw), r20=2*(qx*qz-qy*qw), r01=2*(qx*qy-qz*qw), r11=1-2*(qx*qx+qz*qz), r21=2*(qy*qz+qx*qw), r02=2*(qx*qz+qy*qw), r12=2*(qy*qz-qx*qw), r22=1-2*(qx*qx+qy*qy);
        let ox=(r10*f20-r20*f10)+(r11*f21-r21*f11)+(r12*f22-r22*f12), oy=(r20*f00-r00*f20)+(r21*f01-r01*f21)+(r22*f02-r02*f22), oz=(r00*f10-r10*f00)+(r01*f11-r11*f01)+(r02*f12-r12*f02);
        const den=1/(Math.abs(r00*f00+r10*f10+r20*f20+r01*f01+r11*f11+r21*f21+r02*f02+r12*f12+r22*f22)+1e-9); ox*=den; oy*=den; oz*=den;
        const wl=Math.hypot(ox,oy,oz);
        if (wl>1e-9){ const sn=Math.sin(wl*.5)/wl, cs=Math.cos(wl*.5), bx=ox*sn, by=oy*sn, bz=oz*sn;
          const nx=cs*qx+qw*bx+by*qz-bz*qy, ny=cs*qy+qw*by+bz*qx-bx*qz, nz=cs*qz+qw*bz+bx*qy-by*qx, nw=cs*qw-bx*qx-by*qy-bz*qz, il=1/Math.hypot(nx,ny,nz,nw);
          qx=nx*il; qy=ny*il; qz=nz*il; qw=nw*il; Q[t*4]=qx; Q[t*4+1]=qy; Q[t*4+2]=qz; Q[t*4+3]=qw;
          r00=1-2*(qy*qy+qz*qz); r10=2*(qx*qy+qz*qw); r20=2*(qx*qz-qy*qw); r01=2*(qx*qy-qz*qw); r11=1-2*(qx*qx+qz*qz); r21=2*(qy*qz+qx*qw); r02=2*(qx*qz+qy*qw); r12=2*(qy*qz-qx*qw); r22=1-2*(qx*qx+qy*qy); }

  BG.turf=bg(P.turf,[G0]); BG.grass=bg(P.grass,[G0,[1,samp],[2,fieldTex.createView()]]); BG.knife=bg(P.knife,[G0,[1,{buffer:kbuf}]]); BG.bub=bg(P.bub,[G0]); BG.thick=bg(P.thick,[G0]);
  BG.blit=bg(P.blit,[[1,samp],[2,sceneTex.createView()]]); BG.jelly=bg(P.jelly,[G0,[1,samp],[2,sceneTex.createView()],[3,thickTex.createView()],[4,faceTex.createView()]]);
  BG.wire=bg(P.wire,[G0]); BG.present=bg(P.present,[G0,[1,samp],[2,finalTex.createView()]]); }

// static geometry: grass instances and the knife
const NBLADE=90000; const grassBuf=device.createBuffer({size:NBLADE*32,usage:GPUBufferUsage.VERTEX|GPUBufferUsage.COPY_DST});
function makeGrass(){ const r=mulberry32(5), a=new Float32Array(NBLADE*8), n=Math.floor(Math.sqrt(NBLADE)), E=R*6.5, c=E*2/n;
  for (let i=0;i<n*n;i++){ const o=i*8; a[o]=-E+((i%n)+r())*c; a[o+1]=-E+(Math.floor(i/n)+r())*c; a[o+2]=cfg.blade*(.68+r()*.62); a[o+3]=r()*TAU; a[o+4]=r(); a[o+5]=cfg.blade*(.07+r()*.05); a[o+6]=r()*2-1; a[o+7]=r()*2-1; }
  device.queue.writeBuffer(grassBuf,0,a); }
const knifeMesh=(()=>{ const v=[], quad=(a,b,c,d,col)=>{ const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2], vx=d[0]-a[0],vy=d[1]-a[1],vz=d[2]-a[2]; let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx; const l=Math.hypot(nx,ny,nz)||1; nx/=l; ny/=l; nz/=l;
    for (const p of [a,b,c,a,c,d]) v.push(...p,nx,ny,nz,...col); };
  const L=1.9, H=1.15, T=.035, st=[.78,.8,.82], hd=[.035,.03,.028];                       // blade: edge along y = 0, spine on top
  quad([-L,0,0],[L,0,0],[L,H,T],[-L,H,T],st); quad([L,0,0],[-L,0,0],[-L,H,-T],[L,H,-T],st); quad([-L,H,T],[L,H,T],[L,H,-T],[-L,H,-T],st);
  quad([-L,0,0],[-L,H,T],[-L,H,-T],[-L,0,0],st); quad([L,0,0],[L,H,-T],[L,H,T],[L,0,0],st);
  const x0=L, x1=L+.95, y0=H*.6, y1=H*.9, z=.07;                                             // handle
  quad([x0,y0,z],[x1,y0,z],[x1,y1,z],[x0,y1,z],hd); quad([x1,y0,-z],[x0,y0,-z],[x0,y1,-z],[x1,y1,-z],hd); quad([x0,y1,z],[x1,y1,z],[x1,y1,-z],[x0,y1,-z],hd);
  quad([x0,y0,-z],[x1,y0,-z],[x1,y0,z],[x0,y0,z],hd); quad([x1,y0,z],[x1,y0,-z],[x1,y1,-z],[x1,y1,z],hd);
  const a=new Float32Array(v), b=device.createBuffer({size:a.byteLength,usage:GPUBufferUsage.VERTEX|GPUBufferUsage.COPY_DST}); device.queue.writeBuffer(b,0,a); return {b,n:a.length/9}; })();

// dynamic buffers, grown when a cut makes the surface bigger
let jvb=null, jib=null, jcap=0, icap=0, jdata=new Float32Array(0), wvb=null, wcap=0, bbuf=device.createBuffer({size:64*16,usage:GPUBufferUsage.VERTEX|GPUBufferUsage.COPY_DST}), bdata=new Float32Array(64*4);
function uploadSurface(){
  if (nVis>jcap){ if (jvb) jvb.destroy(); jcap=Math.ceil(nVis*1.5); jvb=device.createBuffer({size:jcap*40,usage:GPUBufferUsage.VERTEX|GPUBufferUsage.COPY_DST}); jdata=new Float32Array(jcap*10); }
  if (surfaceDirty){ if (VIDX.length>icap){ if (jib) jib.destroy(); icap=Math.ceil(VIDX.length*1.5); jib=device.createBuffer({size:icap*4,usage:GPUBufferUsage.INDEX|GPUBufferUsage.COPY_DST}); } device.queue.writeBuffer(jib,0,VIDX); surfaceDirty=false; }
  skinSurface(jdata); device.queue.writeBuffer(jvb,0,jdata,0,nVis*10);
}
const mouse=[-9999,-9999]; let tNow=0;
function frame(){
  resize(); const w=canvas.width, h=canvas.height, dpr=w/canvas.clientWidth;
  uploadSurface(); device.queue.writeTexture({texture:fieldTex},fieldBytes,{bytesPerRow:FG*4},[FG,FG]);
  let nb=0; for (const b of BUB){ if (b.gone || nb>=64) continue; const t=b.t*4, o=nb*4; for (let k=0;k<3;k++) bdata[o+k]=X[TV[t]*3+k]*b.w[0]+X[TV[t+1]*3+k]*b.w[1]+X[TV[t+2]*3+k]*b.w[2]+X[TV[t+3]*3+k]*b.w[3]; bdata[o+3]=b.rad; nb++; }
  device.queue.writeBuffer(bbuf,0,bdata,0,nb*4);
  // globals
  GU.set(cam.vp,0); GU.set([cam.eye[0],cam.eye[1],cam.eye[2],tNow],16); const L=[-.42,.8,.43], ll=Math.hypot(...L); GU.set([L[0]/ll,L[1]/ll,L[2]/ll,0],20);
  GU.set([w,h,R,dpr],24); GU.set([cfg.id,0,S.faceOn?1:0,S.faceInt],28); GU.set([1.42*S.faceSize,S.faceRot*Math.PI/180,0,0],32); /* decal reaches 81 degrees from the front at 100% */ GU.set([...cfg.sig,cfg.milk],36); GU.set([...cfg.sca,cfg.sheen],40);
  const rect=el=>{ const r=el.getBoundingClientRect(); return [r.left*dpr,r.top*dpr,r.width*dpr,r.height*dpr]; }, open=$('crop').classList.contains('open');
  GU.set([Math.min(PINFO.length,16),0,0,0],44); GU.set(rect($('panel')),48); GU.set(open?rect($('crop')):[0,0,0,0],52); GU.set([mouse[0]*dpr,mouse[1]*dpr,open?1:0,0],56);
  GU.set([...cam.r,0],60); GU.set([...cam.u,0],64); GU.set([...cam.f,Math.hypot(cam.eye[0]-cam.tgt[0],cam.eye[1]-cam.tgt[1],cam.eye[2]-cam.tgt[2])],68); GU.set(rect($('back')),72); GU.set([FE,cfg.blade,0,0],76);
  for (let i=0;i<16;i++){ const p=PINFO[i]; GU.set(p?[p.x,p.y,p.z,p.r]:[0,0,0,0],80+i*4); GU.set([...cfg.sca,0],144+i*4); }
  device.queue.writeBuffer(gbuf,0,GU);
  const enc=device.createCommandEncoder();
  { const p=enc.beginRenderPass({colorAttachments:[{view:sceneTex.createView(),clearValue:{r:.01,g:.014,b:.012,a:1},loadOp:'clear',storeOp:'store'}],depthStencilAttachment:{view:depthTex.createView(),depthClearValue:1,depthLoadOp:'clear',depthStoreOp:'store'}});
    p.setPipeline(P.turf); p.setBindGroup(0,BG.turf); p.draw(6);
    p.setPipeline(P.grass); p.setBindGroup(0,BG.grass); p.setVertexBuffer(0,grassBuf); p.draw(9,NBLADE);
    if (knife){ const k=knife, sx=clamp(k.len/3.4,R,R*1.6), cx=(k.ax+k.bx)/2, cz=(k.az+k.bz)/2;
      device.queue.writeBuffer(kbuf,0,new Float32Array([k.dx*sx,0,k.dz*sx,0, 0,R,0,0, -k.dz*R,0,k.dx*R,0, cx,k.edge,cz,1]));
      p.setPipeline(P.knife); p.setBindGroup(0,BG.knife); p.setVertexBuffer(0,knifeMesh.b); p.draw(knifeMesh.n); }
    if (nb){ p.setPipeline(P.bub); p.setBindGroup(0,BG.bub); p.setVertexBuffer(0,bbuf); p.draw(6,nb); }
    p.end(); }
  { const p=enc.beginRenderPass({colorAttachments:[{view:thickTex.createView(),clearValue:{r:0,g:0,b:0,a:0},loadOp:'clear',storeOp:'store'}]});
    p.setPipeline(P.thick); p.setBindGroup(0,BG.thick); p.setVertexBuffer(0,jvb); p.setIndexBuffer(jib,'uint32'); p.drawIndexed(VIDX.length); p.end(); }
  { const p=enc.beginRenderPass({colorAttachments:[{view:finalTex.createView(),clearValue:{r:0,g:0,b:0,a:1},loadOp:'clear',storeOp:'store'}],depthStencilAttachment:{view:depthTex.createView(),depthLoadOp:'load',depthStoreOp:'store'}});
    p.setPipeline(P.blit); p.setBindGroup(0,BG.blit); p.draw(3);
    p.setPipeline(P.jelly); p.setBindGroup(0,BG.jelly); p.setVertexBuffer(0,jvb); p.setIndexBuffer(jib,'uint32'); p.drawIndexed(VIDX.length);
    if (S.mesh){ const n=EDGE.length; if (n>wcap){ if (wvb) wvb.destroy(); wcap=Math.ceil(n*1.5); wvb=device.createBuffer({size:wcap*12,usage:GPUBufferUsage.VERTEX|GPUBufferUsage.COPY_DST}); }
      const a=new Float32Array(n*3); for (let i=0;i<n;i++){ a[i*3]=X[EDGE[i]*3]; a[i*3+1]=X[EDGE[i]*3+1]; a[i*3+2]=X[EDGE[i]*3+2]; } device.queue.writeBuffer(wvb,0,a);
      p.setPipeline(P.wire); p.setBindGroup(0,BG.wire); p.setVertexBuffer(0,wvb); p.draw(n); }
    p.end(); }
  { const p=enc.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(),loadOp:'clear',storeOp:'store',clearValue:{r:0,g:0,b:0,a:1}}]}); p.setPipeline(P.present); p.setBindGroup(0,BG.present); p.draw(3); p.end(); }
  device.queue.submit([enc.finish()]);
}
let last=performance.now(), acc=0, fps=60;
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; tNow+=dt; fps+=(1/Math.max(dt,1e-3)-fps)*.05;
  if (!S.paused){ acc+=dt*(S.slow?.25:1); let n=0; while (acc>=STEP && n<3){ physicsStep(); acc-=STEP; n++; } if (n===3) acc=0; }
  frame(); requestAnimationFrame(loop); }

/* ==================================================================== 9. INTERFACE */
function newBall(){ buildBall(); fieldReset(); fieldStep(STEP); makeGrass(); setCamera(); }
const segs=(id,key,then)=>{ for (const b of $(id).children) b.onclick=()=>{ S[key]=b.dataset.v; for (const o of $(id).children) o.classList.toggle('on',o===b); then&&then(); }; };
segs('tool','tool',()=>document.body.classList.toggle('knife',S.tool==='knife'));
segs('ball','ball',()=>{ const c=BALLS[S.ball]; S.firm=c.firm; S.damp=c.damp; syncSliders(); newBall(); });
const slider=(id,key,fmt)=>{ const el=$(id), out=$(id+'V'); el.oninput=()=>{ S[key]=+el.value; out.textContent=fmt(S[key]); }; return ()=>{ el.value=S[key]; out.textContent=fmt(S[key]); }; };
const sync=[slider('firm','firm',v=>v.toFixed(2)),slider('damp','damp',v=>v.toFixed(2)),slider('fSize','faceSize',v=>Math.round(v*100)+'%'),slider('fRot','faceRot',v=>Math.round(v)+'°'),slider('fInt','faceInt',v=>Math.round(v*100)+'%')];
const syncSliders=()=>sync.forEach(f=>f());
const toggle=(id,key)=>{ $(id).onclick=()=>{ S[key]=!S[key]; $(id).classList.toggle('on',S[key]); }; };
toggle('bSlow','slow'); toggle('bMesh','mesh'); toggle('bPause','paused');
$('bReset').onclick=newBall;
$('bNudge').onclick=()=>{ const r=Math.random, k=Math.sqrt(R/.05), a=r()*TAU, vx=Math.cos(a)*1.1*k, vz=Math.sin(a)*1.1*k, sp=(r()-.5)*40;
  for (let i=0;i<np;i++){ const p=PINFO[PIECE[i]], rx=X[i*3]-p.x, rz=X[i*3+2]-p.z; V[i*3]+=vx*.8-rz*sp*.2; V[i*3+1]+=1.25*k; V[i*3+2]+=vz*.8+rx*sp*.2; } };

// pointer: grab and pull in Hand mode (scroll or a second finger twists), draw a stroke in Knife mode
const pts=new Map(); let stroke=null, twist0=0;
canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
  if (S.tool==='hand'){ if (pts.size===1) startGrab(e.clientX,e.clientY); else if (pts.size===2 && grab){ const [a,b]=[...pts.values()]; twist0=Math.atan2(b[1]-a[1],b[0]-a[0])-grab.twist; } }
  else if (pts.size===1){ stroke=[e.clientX,e.clientY,e.clientX,e.clientY]; drawStroke(); } });
canvas.addEventListener('pointermove',e=>{ mouse[0]=e.clientX; mouse[1]=e.clientY; if (!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
  if (S.tool==='hand'){ const [a,b]=[...pts.values()]; if (pts.size===2 && grab) grab.twist=Math.atan2(b[1]-a[1],b[0]-a[0])-twist0; else if (pts.keys().next().value===e.pointerId) moveGrab(e.clientX,e.clientY); }
  else if (stroke){ stroke[2]=e.clientX; stroke[3]=e.clientY; drawStroke(); } });
const lift=e=>{ pts.delete(e.pointerId); if (S.tool==='hand'){ if (!pts.size) grab=null; } else if (stroke){ startKnife(...stroke); stroke=null; drawStroke(); } };
canvas.addEventListener('pointerup',lift); canvas.addEventListener('pointercancel',lift);
canvas.addEventListener('wheel',e=>{ if (grab){ e.preventDefault(); grab.twist+=e.deltaY*.004; } },{passive:false});
addEventListener('pointermove',e=>{ mouse[0]=e.clientX; mouse[1]=e.clientY; });
function drawStroke(){ const l=$('strokeLine'); if (!stroke){ l.setAttribute('visibility','hidden'); return; } l.setAttribute('visibility','visible'); l.setAttribute('x1',stroke[0]); l.setAttribute('y1',stroke[1]); l.setAttribute('x2',stroke[2]); l.setAttribute('y2',stroke[3]); }
addEventListener('keydown',e=>{ if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) && e.target.type!=='range') return; const k=e.key.toLowerCase();
  if (k==='h') $('tool').children[0].click(); else if (k==='k') $('tool').children[1].click(); else if (k==='r') newBall(); else if (k===' '){ e.preventDefault(); $('bPause').click(); } });

// face: upload or drop an image, frame it in a circle, then it is copied into a texture. Nothing leaves the browser.
const crop={img:null,x:0,y:0,z:1,drag:null}, cv=$('cropView'), c2=cv.getContext('2d');
function openCrop(file){ if (!file || !/^image\/(jpeg|png|webp)$/.test(file.type)) return; const url=URL.createObjectURL(file), img=new Image();
  img.onload=async()=>{ URL.revokeObjectURL(url); crop.img=img; crop.z=1; crop.x=img.width/2; crop.y=img.height/2; $('cZoom').value=1;
    try { if ('FaceDetector' in window){ const f=await new FaceDetector({fastMode:true,maxDetectedFaces:1}).detect(img); if (f[0]){ const b=f[0].boundingBox; crop.x=b.x+b.width/2; crop.y=b.y+b.height/2; crop.z=clamp(Math.min(img.width,img.height)/(Math.max(b.width,b.height)*1.7),1,5); $('cZoom').value=crop.z; } } } catch(e){}
    $('crop').classList.add('open'); drawCrop(); };
  img.src=url; }
const cropScale=()=>cv.width/(Math.min(crop.img.width,crop.img.height)/crop.z);
function drawCrop(target,size){ const g=target||c2, n=size||cv.width, s=n/(Math.min(crop.img.width,crop.img.height)/crop.z);
  g.fillStyle='#000'; g.fillRect(0,0,n,n); g.drawImage(crop.img,n/2-crop.x*s,n/2-crop.y*s,crop.img.width*s,crop.img.height*s);
  if (!target){ g.save(); g.fillStyle='rgba(0,0,0,.55)'; g.beginPath(); g.rect(0,0,n,n); g.arc(n/2,n/2,n/2-6,0,TAU,true); g.fill('evenodd'); g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=2; g.beginPath(); g.arc(n/2,n/2,n/2-6,0,TAU); g.stroke(); g.restore(); } }
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); crop.drag=[e.clientX,e.clientY]; });
cv.addEventListener('pointermove',e=>{ if (!crop.drag) return; const k=cv.width/cv.clientWidth/cropScale(); crop.x-=(e.clientX-crop.drag[0])*k; crop.y-=(e.clientY-crop.drag[1])*k; crop.drag=[e.clientX,e.clientY]; drawCrop(); });
cv.addEventListener('pointerup',()=>crop.drag=null);
cv.addEventListener('wheel',e=>{ e.preventDefault(); crop.z=clamp(crop.z*Math.exp(-e.deltaY*.0015),1,5); $('cZoom').value=crop.z; drawCrop(); },{passive:false});
$('cZoom').oninput=()=>{ crop.z=+$('cZoom').value; drawCrop(); };
$('cCancel').onclick=()=>$('crop').classList.remove('open');
$('cApply').onclick=()=>{ const o=document.createElement('canvas'); o.width=o.height=FACE; drawCrop(o.getContext('2d'),FACE);
  device.queue.copyExternalImageToTexture({source:o},{texture:faceTex},[FACE,FACE]); S.faceOn=true; $('bRemove').disabled=false; $('crop').classList.remove('open'); };
$('bUpload').onclick=()=>$('file').click();
$('file').onchange=()=>{ openCrop($('file').files[0]); $('file').value=''; };
$('bRemove').onclick=()=>{ S.faceOn=false; $('bRemove').disabled=true; };
addEventListener('dragover',e=>{ e.preventDefault(); document.body.classList.add('drop'); });
addEventListener('dragleave',()=>document.body.classList.remove('drop'));
addEventListener('drop',e=>{ e.preventDefault(); document.body.classList.remove('drop'); openCrop(e.dataTransfer.files[0]); });

addEventListener('resize',resize);
resize(); newBall(); syncSliders();
window.JP={ S, get dbg(){ return {BF,PIECE,CUT,X,XR,TV,VIDX,VB_K,nVis}; }, get stats(){ let v=0; for (let t=0;t<nt;t++) v+=vol6(X,TV[t*4],TV[t*4+1],TV[t*4+2],TV[t*4+3])/6; return {particles:np,tets:nt,pieces:nPieces,surfaceVerts:nVis,massKg:+(RHO*restVolume).toFixed(4),volumePct:+(v/restVolume*100).toFixed(1),fps:Math.round(fps)}; },
  cut:(nx,nz,d)=>{ const s=new Set(); for (let i=0;i<nPieces;i++) s.add(i); performCut(nx,0,nz,d||0,s); }, step:physicsStep };
requestAnimationFrame(loop);
